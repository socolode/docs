backend:
  name: github
  repo: socolode/docs
  branch: main
  # 使用Decap官方公共OAuth代理（仅公开仓库可用，私有仓库需自行配置OAuth App）
  base_url: https://oauth.decapcms.org

# 媒体文件配置
media_folder: "static/img" # 图片上传到仓库的static/img目录
public_folder: "/img" # 站点访问图片的路径

# 站点地址，用于生成预览链接
site_url: https://docs.socolode.com
display_url: https://docs.socolode.com

# 内容集合配置
collections:
  - name: "docs-en"
    label: "英文文档"
    folder: "docs"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "侧边栏位置", name: "sidebar_position", widget: "number", required: false}
      - {label: "描述", name: "description", widget: "string", required: false}
      - {label: "正文", name: "body", widget: "markdown"}

  - name: "docs-zh"
    label: "中文文档"
    folder: "i18n/zh-CN/docusaurus-plugin-content-docs/current"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "侧边栏位置", name: "sidebar_position", widget: "number", required: false}
      - {label: "描述", name: "description", widget: "string", required: false}
      - {label: "正文", name: "body", widget: "markdown"}
